<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geovisor Satelital</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/estilos.css" />
</head>
<body>
    <header id="encabezado-principal" class="encabezado">
        <div class="encabezado__contenedor-titulo">
            <img id="logo-institucion" class="encabezado__logo" src="imagenes/logo-institucion.svg">
            
            <div class="encabezado__grupo-titulo">
                <p id="texto-institucion" class="encabezado__titulo">Infraestructura de Datos Espaciales</p>
                <p id="texto-aplicacion" class="encabezado__subtitulo">Geovisor Satelital de Datos Públicos</p>
            </div>
        </div>
    </header>

    <div class="control-panel">
        
        <!-- Selector de Sensor -->
        <div class="control-group">
            <label for="sensor">Sensor:</label>
            <select id="sensor">
                <option value="sentinel-2">Sentinel-2 (Óptico)</option>
                <option value="sentinel-1">Sentinel-1 (Radar SAR)</option>
            </select>
        </div>

        <!-- Selector de Órbita (Oculto por defecto para Sentinel-2) -->
        <div class="control-group" id="divOrbita" style="display: none;">
            <label for="orbita">Órbita (SAR):</label>
            <select id="orbita">
                <option value="AMBAS">Ambas (Combinadas)</option>
                <option value="ASCENDING">Ascendente</option>
                <option value="DESCENDING">Descendente</option>
            </select>
        </div>

        <div class="control-group">
            <label for="tipoCapa">Capa Satelital:</label>
            <select id="tipoCapa">
                <option value="">Cargando capas...</option>
            </select>
        </div>

        <div class="control-group">
            <label for="fechaInicio">Fecha Desde:</label>
            <input type="date" id="fechaInicio">
        </div>

        <div class="control-group">
            <label for="fechaFin">Fecha Hasta:</label>
            <input type="date" id="fechaFin">
        </div>

        <!-- Este grupo se ocultará automáticamente cuando se seleccione Sentinel-1 -->
        <div class="control-group" id="divNubes">
            <div class="slider-header">
                <label for="cloudSlider">Máx. Nubes:</label>
                <span id="cloudVal" class="slider-val">30%</span>
            </div>
            <input 
                type="range" 
                id="cloudSlider" 
                min="0" 
                max="100" 
                step="5" 
                value="30" 
                oninput="document.getElementById('cloudVal').innerText = `${this.value}%`"
            >
        </div>

        <div class="control-group">
            <div class="slider-header">
                <label for="opacitySlider">Opacidad Capa:</label>
                <span id="opacityVal" class="slider-val">85%</span>
            </div>
            <input 
                type="range" 
                id="opacitySlider" 
                min="0" 
                max="1" 
                step="0.05" 
                value="0.85" 
                oninput="cambiarOpacidad(this.value)"
            >
        </div>

        <button id="btnCargar" class="btn btn-cargar" onclick="actualizarCapa()">Cargar Capa</button>
        
        <div class="control-group">
            <label>Pasadas en esta área:</label>
            <div id="listaFechas" class="fechas-container">
                <span style="color:#888;">Cargando pasadas...</span>
            </div>
        </div>

        <span id="statusMessage"></span>
    </div>

    <div id="map"></div>

    <footer id="pie-principal" class="pie">
        <p id="texto-contacto">© 2026 - IDE Uruguay - ideuy@ide.gub.uy</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/main.js"></script>
</body>
</html>

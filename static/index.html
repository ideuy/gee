<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geovisor Satelital</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="estilos.css" />
</head>
<body>

    <div class="control-panel">
        <h4>Geovisor Satelital</h4>
        
        <div class="control-group">
            <label for="tipoCapa">Capa Satelital:</label>
            <select id="tipoCapa">
                <option value="">Cargando capas...</option>
            </select>
        </div>

        <div class="control-group">
            <label for="fechaInicio">Fecha Desde:</label>
            <input type="date" id="fechaInicio">
        </div>

        <div class="control-group">
            <label for="fechaFin">Fecha Hasta:</label>
            <input type="date" id="fechaFin">
        </div>

        <div class="control-group">
            <div class="slider-header">
                <label for="cloudSlider">Máx. Nubes:</label>
                <span id="cloudVal" class="slider-val">30%</span>
            </div>
            <input 
                type="range" 
                id="cloudSlider" 
                min="0" 
                max="100" 
                step="5" 
                value="30" 
                oninput="document.getElementById('cloudVal').innerText = `${this.value}%`"
            >
        </div>

        <div class="control-group">
            <div class="slider-header">
                <label for="opacitySlider">Opacidad Capa:</label>
                <span id="opacityVal" class="slider-val">85%</span>
            </div>
            <input 
                type="range" 
                id="opacitySlider" 
                min="0" 
                max="1" 
                step="0.05" 
                value="0.85" 
                oninput="cambiarOpacidad(this.value)"
            >
        </div>

        <button id="btnCargar" class="btn btn-cargar" onclick="actualizarCapa()">Cargar Capa</button>
        <button id="btnDescargar" class="btn btn-descargar" onclick="descargarGeoTIFF()">Descargar GeoTIFF</button>
        
        <div class="control-group">
            <label>Pasadas en esta área:</label>
            <div id="listaFechas" class="fechas-container">
                <span style="color:#888;">Cargando pasadas...</span>
            </div>
        </div>

        <span id="statusMessage"></span>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="main.js"></script>
</body>
</html>
